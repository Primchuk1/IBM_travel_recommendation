<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | Travel Recommendation</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <nav aria-label="Main navigation">
        <a class="logo" href="index.html" aria-label="Travel Recommendation home">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
                aria-hidden="true">
                <circle cx="12" cy="12" r="10" />
                <ellipse cx="12" cy="12" rx="4" ry="10" />
                <path d="M2 12h20M4 6h16M4 18h16" />
            </svg>
            <span>Travel Recommendation</span>
        </a>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="about_us.html">About Us</a></li>
            <li><a href="contact_us.html" aria-current="page">Contact Us</a></li>
        </ul>
    </nav>

    <main class="contact-page">
        <section aria-labelledby="contact-heading">
            <h1 id="contact-heading">Contact Us</h1>
            <p>Have questions or feedback? We'd love to hear from you!</p>
            <form class="contact-form" aria-labelledby="contact-heading" aria-describedby="form-note">
                <p id="form-note">All fields are required. This demo form does not send messages yet.</p>
                <div>
                    <label for="name">Name:</label>
                    <input type="text" id="name" name="name" autocomplete="name" placeholder="Your name" required>
                </div>
                <div>
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" autocomplete="email" placeholder="you@example.com"
                        required>
                </div>
                <div>
                    <label for="message">Message:</label>
                    <textarea id="message" name="message" rows="6"
                        placeholder="How can we help with your next adventure?" required></textarea>
                </div>
                <button type="submit">Send Message</button>
                <p id="form-status" role="status"></p>
            </form>
        </section>

    </main>
    <script>
        document.querySelector('.contact-form').addEventListener('submit', function (event) {
            event.preventDefault();
            document.getElementById('form-status').textContent =
                'Your message has not been sent. Message delivery is not available yet.';
        });
    </script>
</body>

</html>
